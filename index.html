  <style>
    /* ==========================================
       HEALTHSNAP DESIGN SYSTEM (CSS VARIABLES)
       ========================================== */
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: #d1fae5;
      --primary-dark: #047857;
      --primary-glow: rgba(16, 185, 129, 0.25);

      --secondary: #06b6d4;
      --secondary-hover: #0891b2;
      --secondary-light: #cffafe;
      --secondary-glow: rgba(6, 182, 212, 0.25);

      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-blue: #3b82f6;

      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-glass: rgba(255, 255, 255, 0.85);

      --border-subtle: #e2e8f0;
      --divider: #f1f5f9;

      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --text-inverse: #ffffff;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
      --shadow-glow-primary: 0 0 24px -4px rgba(16, 185, 129, 0.35);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-full: 9999px;

      --font-heading: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    [data-theme='dark'] {
      --bg-app: #090d16;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --bg-subtle: #1e293b;
      --bg-glass: rgba(17, 24, 39, 0.85);

      --border-subtle: #1e293b;
      --divider: #1f2937;

      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
      --shadow-glow-primary: 0 0 30px -4px rgba(16, 185, 129, 0.45);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font-body);
      color: var(--text-main);
      background-color: var(--bg-app);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      letter-spacing: -0.02em;
      font-weight: 700;
      color: var(--text-main);
    }

    p {
      color: var(--text-secondary);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    input, textarea, select {
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
        transform: scale(1.02);
      }
    }

    @keyframes laserScan {
      0% { top: 6%; opacity: 0.8; }
      50% { top: 92%; opacity: 1; }
      100% { top: 6%; opacity: 0.8; }
    }

    @keyframes audioWave {
      0%, 100% { height: 8px; }
      50% { height: 36px; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary) 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-emerald {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    [data-theme='dark'] .badge-emerald { color: #34d399; }

    .badge-blue {
      background: rgba(6, 182, 212, 0.12);
      color: #0891b2;
      border: 1px solid rgba(6, 182, 212, 0.25);
    }
    [data-theme='dark'] .badge-blue { color: #38bdf8; }

    .badge-amber {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, #0d9488 100%);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn-outline-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--radius-md);
    }

    .btn-outline-primary:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    [data-theme='dark'] ::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>

    const SPEAK_PRESETS = [
      {
        id: "sp-1",
        label: "Poor Sleep & Tiredness",
        transcription: "I didn't sleep well last night and I'm feeling tired today.",
        understanding: { sleep: "Poor", energy: "Low", mood: "Tired" },

      {

      {

        transcription: "Busy workday with back-to-back calls, skipped lunch, and noticing a dull headache.",

      }
    ];

    const INITIAL_JOURNAL = [
      {
        id: "j-1",
        timestamp: "Today, 2:30 PM",
        feeling: "Tired",
        feelingEmoji: "🥱",
        symptoms: "Headache for 2 hours",

      },
      {

        timestamp: "Yesterday, 8:45 PM",
        feeling: "Good",
        feelingEmoji: "🙂",
        symptoms: "Relaxed evening walk",
        severity: "Mild",
        duration: "Less than 1 hour"
      }
    ];

    const INITIAL_PATTERNS = [
      {
        id: "pat-1",
        title: "Sleep + Activity",
        signalIcons: ["😴", "🏃"],
        correlation: "High (0.76)",
        summary: "Your activity has been lower on days when your sleep duration is below your usual level.",
        detail: "On nights with less than 6.5 hours of rest, daily step totals drop by 22% and afternoon active minutes decrease."
      },
      {

        signalIcons: ["📸", "🏃"],
        correlation: "Moderate (0.64)",
        summary: "Your recent meals and activity levels show an opportunity to improve daily balance.",
        detail: "Days with complex carbohydrate breakfasts coincided with 35% higher stamina during mid-day movement."
      },
      {
        id: "pat-3",
        title: "Wellness Journal",
        signalIcons: ["📝", "🎤"],
        correlation: "Notable (3 reports)",
        summary: "You reported tiredness on multiple days this week.",
        detail: "Mid-afternoon fatigue was most frequently reported following continuous screen time without hydration breaks."
      }
    ];

    const INITIAL_GUIDANCE = [
      {
        id: "g-1",
        title: "Improve Sleep",
        category: "Rest & Recovery",
        icon: "moon",
        description: "Try maintaining a consistent sleep schedule.",
        actionLabel: "Set Sleep Reminder",
        completed: false
      },
      {
        id: "g-2",
        title: "Stay Active",
        category: "Movement",
        icon: "footprints",
        description: "Consider adding a short walk to your day.",
        actionLabel: "Log 15m Walk (+1,000 steps)",
        completed: true
      },
      {
        id: "g-3",
        title: "Balanced Meals",
        category: "Nutrition",
        icon: "utensils",
        description: "Try including vegetables and protein in your meals.",
        actionLabel: "Snap Next Meal",
        completed: false
      },
      {
        id: "g-4",
        title: "Stay Hydrated",
        category: "Hydration",
        icon: "droplet",
        description: "Remember to maintain regular water intake.",
        actionLabel: "Log +250ml Water",
        completed: false
      }
    ];

    const INITIAL_NOTIFS = [
      {
        id: "n-1",
        type: "pattern",
        title: "Wellness Pattern",
        message: "Your sleep has been below your target for 3 days.",
        time: "25 min ago",
        read: false
      },
      {
        id: "n-2",
        type: "suggestion",
        title: "Daily Suggestion",
        message: "You're close to your activity goal today (80% achieved).",
        time: "2h ago",
        read: false
      },
      {
        id: "n-3",
        type: "food",
        title: "Food Reminder",
        message: "Log your meal to keep your food tracking updated.",
        time: "4h ago",
        read: true
      }
    ];

    // --- CONTEXT & HOOK ---
    const WellnessCtx = createContext();

    function WellnessProvider({ children }) {
      const [user, setUser] = useState(() => {
        const s = localStorage.getItem('hs_user');
        return s ? JSON.parse(s) : INITIAL_USER;
      });
      const [score, setScore] = useState(() => {
        const s = localStorage.getItem('hs_score');
        return s ? JSON.parse(s) : INITIAL_WELLNESS_SCORE;
      });
      const [activity, setActivity] = useState(() => {
        const s = localStorage.getItem('hs_activity');
        return s ? JSON.parse(s) : INITIAL_ACTIVITY;
      });
      const [sleep, setSleep] = useState(() => {
        const s = localStorage.getItem('hs_sleep');
        return s ? JSON.parse(s) : INITIAL_SLEEP;
      });
      const [foodLogs, setFoodLogs] = useState(() => {
        const s = localStorage.getItem('hs_food');
        return s ? JSON.parse(s) : FOOD_PRESETS.slice(0, 2);
      });
      const [journal, setJournal] = useState(() => {
        const s = localStorage.getItem('hs_journal');
        return s ? JSON.parse(s) : INITIAL_JOURNAL;
      });
      const [patterns, setPatterns] = useState(INITIAL_PATTERNS);
      const [guidance, setGuidance] = useState(() => {
        const s = localStorage.getItem('hs_guidance');
        return s ? JSON.parse(s) : INITIAL_GUIDANCE;
      });
      const [notifs, setNotifs] = useState(INITIAL_NOTIFS);

      const [activeView, setActiveView] = useState('landing');
      const [theme, setTheme] = useState('light');
      const [toast, setToast] = useState(null);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('hs_user', JSON.stringify(user));
        localStorage.setItem('hs_score', JSON.stringify(score));
        localStorage.setItem('hs_activity', JSON.stringify(activity));
        localStorage.setItem('hs_sleep', JSON.stringify(sleep));
        localStorage.setItem('hs_food', JSON.stringify(foodLogs));
        localStorage.setItem('hs_journal', JSON.stringify(journal));
        localStorage.setItem('hs_guidance', JSON.stringify(guidance));
      }, [user, score, activity, sleep, foodLogs, journal, guidance]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');

      const addFood = (meal) => {
        setFoodLogs(prev => [meal, ...prev]);
        setScore(s => ({ ...s, score: Math.min(100, s.score + 1) }));
        showToast(`📸 ${meal.name} logged to food diary!`);
      };

      const addJournalEntry = (entry) => {
        setJournal(prev => [{ id: `j-${Date.now()}`, timestamp: "Just now", ...entry }, ...prev]);
        showToast("📝 Wellness entry added successfully.");
      };

      const addVoiceEntry = (transcript, under) => {
        setJournal(prev => [
          {
            id: `v-${Date.now()}`,
            timestamp: "Just now",
            feeling: under.mood || "Tired",
            feelingEmoji: "🥱",
            symptoms: transcript,
            severity: "Moderate",
            duration: "Voice Logged"
          },
          ...prev
        ]);
        showToast("🎤 Voice log analyzed and recorded to wellness history!");
      };

      const logQuickSteps = (count) => {
        setActivity(prev => {
          const newSteps = prev.steps + count;
          return {
            ...prev,
            steps: newSteps,
            percentAchieved: Math.min(100, Math.round((newSteps / prev.goal) * 100)),
            distanceKm: parseFloat((prev.distanceKm + count * 0.00075).toFixed(1)),
            caloriesBurned: prev.caloriesBurned + Math.round(count * 0.04)
          };
        });
        showToast(`🏃 Added +${count.toLocaleString()} steps!`);
      };

      const toggleGuidance = (id) => {
        setGuidance(prev => prev.map(g => g.id === id ? { ...g, completed: !g.completed } : g));
        showToast("✨ Guidance progress updated!");
      };

      const exportData = () => {
        const data = {
          exportDate: new Date().toISOString(),
          user, score, activity, sleep, foodLogs, journal, patterns, guidance,
          disclaimer: "HealthSnap is strictly for wellness awareness and habit tracking. Not medical diagnosis."
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `HealthSnap_Wellness_Data_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("📥 Exported your wellness dataset as JSON.");
      };

      const resetData = () => {
        setUser(INITIAL_USER);
        setScore(INITIAL_WELLNESS_SCORE);
        setActivity(INITIAL_ACTIVITY);
        setSleep(INITIAL_SLEEP);
        setFoodLogs(FOOD_PRESETS.slice(0, 2));
        setJournal(INITIAL_JOURNAL);
        setGuidance(INITIAL_GUIDANCE);
        localStorage.clear();
        showToast("🔄 Data reset to pristine demo values.");
      };

      return (
        <WellnessCtx.Provider value={{
          user, setUser, score, activity, sleep, foodLogs, journal, patterns, guidance, notifs, setNotifs,
          activeView, setActiveView, theme, toggleTheme, toast, showToast,
          addFood, addJournalEntry, addVoiceEntry, logQuickSteps, toggleGuidance, exportData, resetData
        }}>
          {children}
        </WellnessCtx.Provider>

    function CircularProgress({ score = 78, max = 100, size = 170 }) {
      const strokeWidth = 12;
      const radius = (size - strokeWidth * 2) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (score / max) * circumference;

      return (
        <div style={{ position: 'relative', width: size, height: size, margin: '0 auto' }}>
          <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
            <defs>
              <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#10b981" />
                <stop offset="100%" stopColor="#06b6d4" />
              </linearGradient>
            </defs>
            <circle cx={size/2} cy={size/2} r={radius} stroke="var(--bg-subtle)" strokeWidth={strokeWidth} fill="none" />
            <circle
              cx={size/2} cy={size/2} r={radius}
              stroke="url(#scoreGrad)" strokeWidth={strokeWidth}
              strokeLinecap="round" fill="none"
              strokeDasharray={circumference} strokeDashoffset={offset}
              style={{ transition: 'stroke-dashoffset 1s ease' }}
            />
          </svg>
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center'
          }}>
            <div style={{ fontSize: '2.4rem', fontWeight: 900, lineHeight: 1, fontFamily: 'var(--font-heading)' }}>
              {score} <span style={{ fontSize: '1rem', fontWeight: 500, color: 'var(--text-muted)' }}>/{max}</span>
            </div>
            <span style={{
              fontSize: '0.72rem', fontWeight: 700, color: 'var(--primary)',
              textTransform: 'uppercase', marginTop: '4px', background: 'rgba(16, 185, 129, 0.1)',
              padding: '2px 8px', borderRadius: '999px'
            }}>
              Good
            </span>
          </div>
        </div>
      );
    }

    // --- NOTIFICATIONS DROPDOWN ---
    function NotificationDropdown({ isOpen, onClose }) {
      const { notifs, setNotifs, setActiveView } = useWellness();
      if (!isOpen) return null;

      const unreadCount = notifs.filter(n => !n.read).length;

      const handleRead = (id, type) => {
        setNotifs(prev => prev.map(n => n.id === id ? { ...n, read: true } : n));
        if (type === 'pattern') setActiveView('insights');
        else if (type === 'suggestion') setActiveView('activity');
        else if (type === 'food') setActiveView('snap');
        onClose();
      };

      return (
        <div style={{
          position: 'absolute', top: '100%', right: 0, marginTop: '10px',
          width: '340px', maxWidth: '90vw', background: 'var(--bg-surface-elevated)',
          border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)',
          boxShadow: 'var(--shadow-xl)', zIndex: 100, overflow: 'hidden',
          animation: 'fadeInUp 0.2s ease'
        }}>

            padding: '14px 18px', borderBottom: '1px solid var(--divider)',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center'
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <h4 style={{ fontSize: '0.95rem', margin: 0 }}>Notifications</h4>
              {unreadCount > 0 && (
                <span style={{ fontSize: '0.7rem', fontWeight: 700, background: 'var(--primary)', color: '#fff', padding: '2px 8px', borderRadius: '999px' }}>
                  {unreadCount} new
                </span>
              )}
            </div>
            <button
              onClick={() => { setNotifs(prev => prev.map(n => ({ ...n, read: true }))); }}
              style={{ fontSize: '0.75rem', color: 'var(--primary)', fontWeight: 600 }}
            >
              Mark all read
            </button>
          </div>

          <div style={{ maxHeight: '320px', overflowY: 'auto' }}>
            {notifs.map(n => (
              <div
                key={n.id}
                onClick={() => handleRead(n.id, n.type)}
                style={{
                  padding: '12px 16px', borderBottom: '1px solid var(--divider)',
                  background: n.read ? 'transparent' : 'rgba(16, 185, 129, 0.05)',
                  cursor: 'pointer', display: 'flex', gap: '10px', alignItems: 'flex-start'
                }}
              >
                <span style={{ fontSize: '1.2rem', marginTop: '2px' }}>
                  {n.type === 'pattern' ? '🔔' : n.type === 'suggestion' ? '💡' : '📸'}
                </span>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <strong style={{ fontSize: '0.85rem' }}>{n.title}</strong>

                  <span style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>{n.time}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

        setIsAnalyzing(true);
        setSaved(false);

            id: `custom-${Date.now()}`,

      const [isListening, setIsListening] = useState(false);

      const [understanding, setUnderstanding] = useState(SPEAK_PRESETS[0].understanding);
      const [guidance, setGuidance] = useState(SPEAK_PRESETS[0].guidance);

        setIsListening(true);
        setStatusText('Listening...');
        setSaved(false);

        const target = preset || selectedPreset;
        setSelectedPreset(target);

        setTimeout(() => setStatusText('Simulating speech recognition...'), 800);
        setTimeout(() => {
          setTranscription(target.transcription);
          setUnderstanding(target.understanding);
          setGuidance(target.guidance);
          setIsListening(false);
          setStatusText('Analysis complete');
        }, 1800);
      };

      const handleSave = () => {
        addVoiceEntry(transcription, understanding);
        setSaved(true);
      };

    // --- 5. WELLNESS JOURNAL (LOG WELLNESS) ---
    function WellnessJournalView() {
      const { journal, addJournalEntry } = useWellness();
      const [feeling, setFeeling] = useState('Great');
      const [notes, setNotes] = useState('Headache for 2 hours');
      const [severity, setSeverity] = useState('Moderate');
      const [duration, setDuration] = useState('1–3 hours');
      const [alertMsg, setAlertMsg] = useState(false);

      const feelings = [
        { label: "Great", emoji: "😄" },
        { label: "Good", emoji: "🙂" },
        { label: "Okay", emoji: "😐" },
        { label: "Tired", emoji: "🥱" },
        { label: "Stressed", emoji: "😰" },
        { label: "Low energy", emoji: "🔋" }

      const severities = ["Mild", "Moderate", "High"];
      const durations = [
        "Less than 1 hour",
        "1–3 hours",
        "3–6 hours",
        "More than 6 hours"
      ];

      const handleSave = (e) => {
        e.preventDefault();
        const obj = feelings.find(f => f.label === feeling);
        addJournalEntry({
          feeling,
          feelingEmoji: obj ? obj.emoji : '🙂',
          symptoms: notes || 'Daily wellness observation',
          severity,
          duration
        });
        setAlertMsg(true);
        setTimeout(() => setAlertMsg(false), 4000);

        <div style={{ maxWidth: '960px', margin: '0 auto' }}>

              Allow users to manually record how they feel, symptoms, severity, and duration.

            <div style={{
              background: 'rgba(16, 185, 129, 0.12)', border: '1px solid var(--primary)', borderRadius: 'var(--radius-md)',

                </label>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px' }}>
                  {feelings.map(f => (
                    <button
                      key={f.label}
                      type="button"
                      onClick={() => setFeeling(f.label)}
                      style={{
                        padding: '10px', borderRadius: 'var(--radius-md)',
                        background: feeling === f.label ? 'rgba(16, 185, 129, 0.15)' : 'var(--bg-subtle)',
                        border: feeling === f.label ? '2px solid var(--primary)' : '1px solid var(--border-subtle)',
                        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px'
                      }}
                    >
                      <span style={{ fontSize: '1.4rem' }}>{f.emoji}</span>
                      <span style={{ fontSize: '0.75rem', fontWeight: 600 }}>{f.label}</span>

                </div>
              </div>

              {/* Symptoms / Wellness Notes */}
              <div style={{ marginBottom: '20px' }}>
                <label style={{ fontSize: '0.9rem', fontWeight: 800, display: 'block', marginBottom: '8px' }}>

                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: 'var(--text-muted)' }}>

              <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', padding: '22px' }}>
                <span className="badge-tag badge-blue">Pattern 2</span>
                <h4 style={{ fontSize: '1.15rem', fontWeight: 800, margin: '8px 0 6px' }}>Food + Activity</h4>
                <p style={{ fontSize: '0.88rem', color: 'var(--text-secondary)', lineHeight: 1.5, margin: '0 0 12px 0' }}>
                  "Your recent meals and activity levels show an opportunity to improve daily balance."
                </p>
                <button onClick={() => setActiveView('guidance')} style={{ color: 'var(--secondary)', fontWeight: 700, fontSize: '0.82rem' }}>
                  View Meal Balance ➔
                </button>
              </div>

              {/* Pattern 3 */}
              <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', padding: '22px' }}>
                <span className="badge-tag badge-amber">Pattern 3</span>
                <h4 style={{ fontSize: '1.15rem', fontWeight: 800, margin: '8px 0 6px' }}>Wellness Journal</h4>
                <p style={{ fontSize: '0.88rem', color: 'var(--text-secondary)', lineHeight: 1.5, margin: '0 0 12px 0' }}>
                  "You reported tiredness on multiple days this week."
                </p>
                <button onClick={() => setActiveView('journal')} style={{ color: '#d97706', fontWeight: 700, fontSize: '0.82rem' }}>
                  Review Symptoms ➔
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 9. PERSONALIZED GUIDANCE ---
    function GuidanceView() {
      const { guidance, toggleGuidance, logQuickSteps, setActiveView, showToast } = useWellness();

      const handleAction = (g) => {
        if (g.title === "Stay Active") {
          logQuickSteps(1000);
          toggleGuidance(g.id);
        } else if (g.title === "Balanced Meals") {
          setActiveView('snap');
        } else if (g.title === "Stay Hydrated") {
          showToast("💧 +250ml water logged!");
          toggleGuidance(g.id);
        } else {
          toggleGuidance(g.id);
        }
      };

      return (
        <div style={{ maxWidth: '960px', margin: '0 auto' }}>
          <DisclaimerBanner compact={true} />

          <div style={{ marginBottom: '24px' }}>
            <h1 style={{ fontSize: '2.2rem', fontWeight: 800, margin: 0 }}>Recommended For You</h1>
            <p style={{ fontSize: '1rem', color: 'var(--text-secondary)', margin: '4px 0 0' }}>
              Actionable recommendations tailored to your personal patterns. (Non-medical advice).
            </p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px' }}>
            {guidance.map(item => (
              <div
                key={item.id}
                style={{
                  background: 'var(--bg-surface)', border: item.completed ? '1.5px solid var(--primary)' : '1px solid var(--border-subtle)',
                  borderRadius: 'var(--radius-xl)', padding: '24px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between'
                }}
              >
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                    <span style={{ fontSize: '1.8rem' }}>
                      {item.title === 'Improve Sleep' ? '🌙' : item.title === 'Stay Active' ? '🏃' : item.title === 'Balanced Meals' ? '🥗' : '💧'}
                    </span>
                    <button onClick={() => toggleGuidance(item.id)} style={{ fontSize: '1.2rem' }}>
                      {item.completed ? '✅' : '⚪'}
                    </button>
                  </div>

                  <h3 style={{ fontSize: '1.2rem', fontWeight: 800, margin: '0 0 6px' }}>{item.title}</h3>
                  <p style={{ fontSize: '0.88rem', color: 'var(--text-secondary)', lineHeight: 1.5, margin: 0 }}>
                    "{item.description}"
                  </p>
                </div>

                <div style={{ marginTop: '20px', paddingTop: '16px', borderTop: '1px solid var(--divider)' }}>
                  <button
                    onClick={() => handleAction(item)}
                    className={item.completed ? 'btn-secondary' : 'btn-primary'}
                    style={{ width: '100%', padding: '10px', fontSize: '0.86rem' }}
                  >
                    {item.completed ? '✓ Completed' : item.actionLabel}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- 10. WELLNESS TRENDS (TRACK PAGE) ---
    function TrendsView() {
      const [filter, setFilter] = useState('7d');

      const trendScores = [
        { day: "Monday", score: 72 },
        { day: "Tuesday", score: 75 },
        { day: "Wednesday", score: 78 },
        { day: "Thursday", score: 74 },
        { day: "Friday", score: 81 },
        { day: "Saturday", score: 79 },
        { day: "Sunday", score: 78 }
      ];

      return (
        <div style={{ maxWidth: '960px', margin: '0 auto' }}>
          <DisclaimerBanner compact={true} />

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px', marginBottom: '24px' }}>
            <div>
              <h1 style={{ fontSize: '2.2rem', fontWeight: 800, margin: 0 }}>Your Wellness Journey</h1>
              <p style={{ fontSize: '1rem', color: 'var(--text-secondary)', margin: '4px 0 0' }}>
                Charts for Wellness Score, Activity, Sleep, Food, Mood, and Logged events.
              </p>
            </div>

            {/* Date Filters: 7 Days | 30 Days | 3 Months */}
            <div style={{ display: 'flex', background: 'var(--bg-subtle)', padding: '4px', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-subtle)' }}>
              {[
                { k: '7d', l: '7 Days' },
                { k: '30d', l: '30 Days' },
                { k: '3m', l: '3 Months' }
              ].map(tab => (
                <button
                  key={tab.k}
                  onClick={() => setFilter(tab.k)}
                  style={{
                    padding: '8px 16px', borderRadius: '8px', fontSize: '0.85rem', fontWeight: filter === tab.k ? 700 : 500,
                    background: filter === tab.k ? 'var(--primary)' : 'transparent', color: filter === tab.k ? '#fff' : 'var(--text-secondary)'
                  }}
                >
                  {tab.l}
                </button>
              ))}
            </div>
          </div>

          {/* Your Progress */}
          <div style={{ background: 'rgba(16, 185, 129, 0.1)', border: '1px solid rgba(16, 185, 129, 0.25)', borderRadius: 'var(--radius-xl)', padding: '20px 24px', marginBottom: '24px' }}>
            <h3 style={{ fontSize: '1.15rem', fontWeight: 800, margin: '0 0 4px' }}>Your Progress</h3>
            <p style={{ fontSize: '0.92rem', color: 'var(--text-secondary)', margin: 0 }}>
              "Your overall wellness score has improved compared with last week."
            </p>
          </div>

          {/* Wellness Score Trend */}
          <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-xl)', padding: '26px', marginBottom: '24px' }}>
            <h3 style={{ fontSize: '1.25rem', fontWeight: 800, marginBottom: '6px' }}>Wellness Score Trend</h3>
            <p style={{ fontSize: '0.82rem', color: 'var(--text-muted)', marginBottom: '20px' }}>
              Monday: 72 • Tuesday: 75 • Wednesday: 78 • Thursday: 74 • Friday: 81 • Saturday: 79 • Sunday: 78
            </p>

            <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', height: '220px', padding: '0 10px', borderBottom: '1px solid var(--border-subtle)' }}>
              {trendScores.map(t => {
                const heightPct = Math.round(((t.score - 50) / 50) * 100);
                return (
                  <div key={t.day} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: 1 }}>
                    <span style={{ fontSize: '0.75rem', fontWeight: 800, color: 'var(--primary)', marginBottom: '6px' }}>{t.score}</span>
                    <div style={{
                      width: '42px', height: `${heightPct}%`, borderRadius: '6px 6px 0 0',
                      background: 'linear-gradient(180deg, var(--primary) 0%, #06b6d4 100%)'
                    }} />
                    <span style={{ fontSize: '0.8rem', fontWeight: 600, marginTop: '8px' }}>{t.day.slice(0, 3)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- 11. PROFILE & PRIVACY PAGE ---
    function ProfileView() {
      const { user, setUser, theme, toggleTheme, exportData, resetData } = useWellness();
      const [confirmReset, setConfirmReset] = useState(false);

      const allGoals = [
        "Improve sleep",
        "Increase activity",
        "Improve food habits",
        "Maintain healthy routine"
      ];

      const toggleGoal = (g) => {
        const has = user.goals.includes(g);
        setUser(prev => ({
          ...prev,
          goals: has ? prev.goals.filter(x => x !== g) : [...prev.goals, g]
        }));
      };

      const toggleSetting = (k) => {
        setUser(prev => ({
          ...prev,
          settings: { ...prev.settings, [k]: !prev.settings[k] }
        }));
      };

      return (
        <div style={{ maxWidth: '960px', margin: '0 auto' }}>
          <DisclaimerBanner compact={true} />

          <div style={{ marginBottom: '24px' }}>
            <h1 style={{ fontSize: '2.2rem', fontWeight: 800, margin: 0 }}>My Profile</h1>
            <p style={{ fontSize: '1rem', color: 'var(--text-secondary)', margin: '4px 0 0' }}>
              Personal wellness goals, privacy parameters, and data controls.
            </p>
          </div>

          {/* User Info */}
          <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-xl)', padding: '24px', display: 'flex', alignItems: 'center', gap: '20px', marginBottom: '24px' }}>
            <img src={user.avatar} alt={user.name} style={{ width: '74px', height: '74px', borderRadius: '50%', objectFit: 'cover', border: '3px solid var(--primary)' }} />
            <div>
              <h3 style={{ fontSize: '1.3rem', fontWeight: 800, margin: 0 }}>{user.name}</h3>
              <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', margin: '2px 0 8px' }}>{user.email}</p>
              <span className="badge-tag badge-emerald">Verified Demo Profile</span>
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '24px', marginBottom: '24px' }}>
            {/* Goals */}
            <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-xl)', padding: '24px' }}>
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800, marginBottom: '14px' }}>Wellness Goals</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {allGoals.map(goal => {
                  const checked = user.goals.includes(goal);
                  return (
                    <div
                      key={goal}
                      onClick={() => toggleGoal(goal)}
                      style={{
                        padding: '12px', borderRadius: 'var(--radius-md)', background: checked ? 'rgba(16, 185, 129, 0.1)' : 'var(--bg-subtle)',
                        border: checked ? '1px solid var(--primary)' : '1px solid var(--border-subtle)',
                        display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer'
                      }}
                    >
                      <span style={{ fontSize: '0.88rem', fontWeight: 600 }}>{goal}</span>
                      <span>{checked ? '✅' : '⚪'}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Settings */}
            <div style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-xl)', padding: '24px' }}>
              <h3 style={{ fontSize: '1.2rem', fontWeight: 800, marginBottom: '14px' }}>Settings</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                {/* Notifications */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-md)' }}>
                  <span style={{ fontSize: '0.88rem', fontWeight: 600 }}>Notifications</span>
                  <input type="checkbox" checked={user.settings.notifications} onChange={() => toggleSetting('notifications')} style={{ width: '18px', height: '18px', accentColor: 'var(--primary)' }} />
                </div>
                {/* Privacy */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-md)' }}>
                  <span style={{ fontSize: '0.88rem', fontWeight: 600 }}>Privacy Mode</span>
                  <input type="checkbox" checked={true} readOnly style={{ width: '18px', height: '18px', accentColor: 'var(--primary)' }} />
                </div>
                {/* Data sharing */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-md)' }}>
                  <span style={{ fontSize: '0.88rem', fontWeight: 600 }}>Data sharing</span>
                  <input type="checkbox" checked={user.settings.dataSharing} onChange={() => toggleSetting('dataSharing')} style={{ width: '18px', height: '18px', accentColor: 'var(--primary)' }} />
                </div>
                {/* AI analysis */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-md)' }}>
                  <span style={{ fontSize: '0.88rem', fontWeight: 600 }}>AI analysis</span>
                  <input type="checkbox" checked={user.settings.edgeAi} onChange={() => toggleSetting('edgeAi')} style={{ width: '18px', height: '18px', accentColor: 'var(--primary)' }} />
                </div>
                {/* Dark mode */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: 'var(--bg-subtle)', borderRadius: 'var(--radius-md)' }}>
                  <span style={{ fontSize: '0.88rem', fontWeight: 600 }}>Dark mode</span>
                  <button onClick={toggleTheme} className="btn-secondary" style={{ padding: '4px 12px', fontSize: '0.75rem' }}>
                    {theme === 'dark' ? 'Dark Active' : 'Light Active'}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Section 16: Privacy & AI Safety */}
          <div style={{ background: 'var(--bg-surface)', border: '1px solid rgba(16, 185, 129, 0.3)', borderRadius: 'var(--radius-xl)', padding: '26px', marginBottom: '24px' }}>
            <h3 style={{ fontSize: '1.25rem', fontWeight: 800, margin: '0 0 8px' }}>Your Wellness. Your Data.</h3>
            <p style={{ fontSize: '0.9rem', color: 'var(--text-secondary)', lineHeight: 1.6, margin: '0 0 14px' }}>
              "HealthSnap is designed for wellness awareness. Where possible, suitable AI processing can be performed on the device to reduce unnecessary data sharing."
            </p>

            <div style={{ background: 'rgba(239, 68, 68, 0.08)', border: '1px solid rgba(239, 68, 68, 0.25)', borderRadius: 'var(--radius-md)', padding: '14px', marginBottom: '14px' }}>
              <strong style={{ color: '#dc2626', fontSize: '0.88rem', display: 'block', marginBottom: '4px' }}>Important:</strong>
              <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', margin: 0, lineHeight: 1.5 }}>
                "HealthSnap does not diagnose diseases, prescribe medication, or replace professional medical advice."
              </p>
            </div>

            <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', margin: 0 }}>
              "Consider speaking with a qualified healthcare professional if you are concerned about your symptoms."
            </p>
          </div>

          {/* Buttons: Export & Delete Data */}
          <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap' }}>
            <button onClick={exportData} className="btn-secondary" style={{ padding: '12px 20px', fontSize: '0.9rem' }}>
              📥 Export My Wellness Data
            </button>

            {!confirmReset ? (
              <button
                onClick={() => setConfirmReset(true)}
                style={{ padding: '12px 20px', borderRadius: 'var(--radius-md)', background: 'rgba(239, 68, 68, 0.1)', color: '#ef4444', border: '1px solid rgba(239, 68, 68, 0.3)', fontWeight: 600, fontSize: '0.9rem' }}
              >
                🗑️ Delete My Data
              </button>
            ) : (
              <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                <button onClick={() => { resetData(); setConfirmReset(false); }} style={{ padding: '12px 16px', borderRadius: 'var(--radius-md)', background: '#ef4444', color: '#fff', fontWeight: 700, fontSize: '0.85rem' }}>
                  Confirm Reset Data
                </button>
                <button onClick={() => setConfirmReset(false)} className="btn-secondary" style={{ padding: '12px 14px', fontSize: '0.85rem' }}>
                  Cancel
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP ORCHESTRATOR ---
    function AppContent() {
      const { activeView, toast } = useWellness();

      if (activeView === 'landing') {
        return (
          <>
            <LandingPage />
            {toast && <Toast text={toast} />}
          </>
        );
      }

      const renderView = () => {
        switch (activeView) {
          case 'dashboard': return <DashboardView />;
          case 'snap': return <SnapFoodView />;
          case 'speak': return <SpeakView />;
          case 'journal': return <WellnessJournalView />;
          case 'activity': return <ActivityView />;
          case 'sleep': return <SleepView />;
          case 'insights': return <AIInsightsView />;
          case 'guidance': return <GuidanceView />;
          case 'trends': return <TrendsView />;
          case 'profile': return <ProfileView />;
          default: return <DashboardView />;
        }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Header />
          <div style={{ display: 'flex', flex: 1 }}>
            <div className="desktop-sidebar">
              <Sidebar />
            </div>
            <main style={{ flex: 1, padding: '28px 24px 84px', overflowY: 'auto' }}>
              {renderView()}
            </main>
          </div>
          <MobileNav />
          {toast && <Toast text={toast} />}

          <style>{`
            @media (max-width: 900px) {
              .desktop-sidebar { display: none !important; }
            }
            @media (min-width: 901px) {
              .mobile-only-nav { display: none !important; }
            }
          `}</style>
        </div>
      );
    }

    function Toast({ text }) {
      return (
        <div style={{
          position: 'fixed', bottom: '24px', right: '24px', zIndex: 9999,
          background: 'var(--bg-surface-elevated)', color: 'var(--text-main)',
          border: '1px solid var(--primary)', padding: '12px 20px', borderRadius: 'var(--radius-lg)',
          boxShadow: '0 10px 25px rgba(0,0,0,0.2), 0 0 16px rgba(16, 185, 129, 0.3)',
          display: 'flex', alignItems: 'center', gap: '8px', fontSize: '0.88rem', fontWeight: 600,
          animation: 'fadeInUp 0.25s ease'
        }}>
          <span>{text}</span>
        </div>
      );
    }

    function App() {
      return (
        <WellnessProvider>
          <AppContent />
        </WellnessProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
